(--line);border-radius:11px;background:#fff;cursor:pointer}.icon-btn:hover{background:var(--soft)}.source-list{max-height:520px;overflow:auto;padding:10px 18px 18px}.source-link{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;padding:13px 5px;border-bottom:1px solid #f0f0f3}.source-link:hover{color:var(--purple)}.source-num{font-size:10px;color:#aaaab2}.source-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.source-domain{font-size:10px;color:#9999a3;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty-sources{padding:28px 4px;color:#8f8f99;font-size:12px;text-align:center}.editor-modal{width:min(1080px,100%);height:min(850px,calc(100vh - 36px));display:grid;grid-template-rows:auto minmax(0,1fr) auto auto}.editor-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:18px}.editor-title{font-size:20px;font-weight:700}.editor-sub{font-size:11px;color:#898993;margin-top:3px}.editor-shell{min-height:0;display:grid;grid-template-columns:310px 1fr}.sidebar{min-height:0;border-right:1px solid var(--line);background:#fafafd;display:grid;grid-template-rows:auto minmax(0,1fr)}.sidebar-top{padding:12px;border-bottom:1px solid var(--line)}.video-list{overflow:auto;padding:8px}.video-pick{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:11px;cursor:pointer}.video-pick:hover{background:#f1f1f5}.video-pick.active{background:#ece9ff;color:#251294}.video-pick small{display:block;color:var(--purple);font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}.video-pick strong{font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.editor-content{overflow:auto;padding:22px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:17px;margin-bottom:19px;border-bottom:1px solid var(--line top:1px solid var(--line);background:#fafafd}.publish-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.publish-help{font-size:10px;line-height:1.45;color:#85858f;margin-top:6px}.publish-status{font-size:10px;min-height:14px;margin-top:6px;color:#85858f}.publish-status.good{color:var(--green)}.publish-status.bad{color:var(--danger)}
@media(max-width:900px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.editor-shell{grid-template-columns:260px 1fr}}@media(max-width:700px){.topbar-inner,main{width:min(100% - 28px,1180px)}.topbar-inner{min-height:68px}.brand{font-size:23px}.edit-btn{padding:0 11px}.gallery{grid-template-columns:1fr;gap:30px}main{padding-top:26px}.video-title{font-size:17px}.title-row{padding-right:102px}.sources-btn{min-width:92px}.editor-modal{height:calc(100vh - 18px)}.editor-shell{grid-template-columns:1fr;grid-template-rows:190px 1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.editor-content{padding:17px}.source-edit{grid-template-columns:1fr 38px}.source-edit .name,.source-edit .url{grid-column:1}.source-edit .remove-source{grid-column:2;grid-row:1/3}.youtube-row,.publish-row{grid-template-columns:1fr}.preview{grid-template-columns:110px 1fr}}

<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="#">hranica mysle.</a><button class="edit-btn" id="editTrigger" type="button">Edit mode</button></div></header>
<main><section class="gallery" id="gallery" aria-label="Knižnica videí"><div class="empty-gallery">Načítavam videá...</div></section></main>
<div class="backdrop" id="sourcesBackdrop" aria-hidden="true"><div class="modal"><div class="modal-head"><div><div class="modal-kicker">Zdroje k videu</div><div class="modal-title" id="sourcesTitle"></div></div><button class="icon-btn" id="closeSources" type="button">✕</button></div><div class="source-list" id="sourcesList"></div></div></div>
<div class="backdrop" id="editorBackdrop" aria-hidden="true"><div class="modal editor-modal"><div class="editor-head"><div><div class="editor-title">Edit mode</div><div class="editor-sub">Údaje sa načítavajú zo spoločného videos.json. Žiadny localStorage.</div></div><button class="icon-btn" id="closeEditor" type="button">✕</button></div><div class="editor-shell"><aside class="sidebar"><div class="sidebar-top"><button class="btn add-video" id="addVideo" type="button">+ Pridať nové video</button></div><div class="video-list" id="videoList"></div></aside><section class="editor-content" id="editorContent"></section></div><div class="publish-box"><label style="display:block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:#66666e;margin-bottom:7px">GitHub token pre publikovanie</label><div class="publish-row"><input class="input" id="githubToken" type="password" autocomplete="off" placeholder="github_pat_..."><button class="btn-primary" id="publishBtn" type="button">Publikovať pre všetkých</button></div><div class="publish-help">Token sa nikam neukladá. Musí mať Contents: Read and write iba pre repo serneyy/hranica-mysle.</div><div class="publish-status" id="publishStatus"></div></div><div class="editor-actions"><div class="actions"><button class="btn" id="downloadJson" type="button">Stiahnuť videos.json</button></div><div class="actions"><button class="btn" id="cancelEditor" type="button">Zrušiť</button><button class="btn-primary" id="previewSave" type="button">Použiť náhľad</button></div></div></div></div>
<script>
const REPO='serneyy/hranica-mysle',DATA_FILE='videos.json',$=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],copy=o=>JSON.parse(JSON.stringify(o)),uid=()=>`v_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`;
const esc=(v='')=>String(v).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));
const domain=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return u||''}};
function ytId(url=''){try{const u=new URL(url.trim());if(u.hostname.includes('youtu.be'))return u.pathname.split('/').filter(Boolean)[0]||'';if(u.hostname.includes('youtube.com')){if(u.searchParams.get('v'))return u.searchParams.get('v');const p=u.pathname.split('/').filter(Boolean),i=p.findIndex(x=>['shorts','embed','live'].includes(x));if(i>=0)return p[i+1]||''}}catch{}return''}
const thumb=u=>ytId(u)?`https://i.ytimg.com/vi/${ytId(u)}/maxresdefault.jpg`:'';
function normalize(x){return{videos:(Array.isArray(x?.videos)?x.videos:[]).map(v=>({id:v.id||uid(),title:v.title||'Bez názvu',youtubeUrl:v.youtubeUrl||'',sources:Array.isArray(v.sources)?v.sources:[]}))}}
let data={videos:[]},working={videos:[]},selected=null;
async function loadShared(){try{const r=await fetch(`${DATA_FILE}?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw 0;data=normalize(await r.json());working=copy(data);selected=data.videos[0]?.id||null;render()}catch{data={videos:[]};render();$('#gallery').innerHTML='<div class="empty-gallery">Nepodarilo sa načítať spoločné dáta.</div>'}}
function sourceButton(id){return`<button class="sources-btn" type="button" data-sources="${esc(id)}"><span>Zdroje</span><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h11M11 6l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`}
function render(){const g=$('#gallery');if(!data.videos.length){g.innerHTML='<div class="empty-gallery">Zatiaľ tu nie sú žiadne videá.</div>';return}g.innerHTML=data.videos.map((v,i)=>{const t=thumb(v.youtubeUrl),has=!!ytId(v.youtubeUrl);return`<article class="card ${i===0?'latest':''}"><div class="thumb"><div class="thumb-fallback">hranica mysle.</div>${t?`<img src="${esc(t)}" alt="${esc(v.title)}" loading="lazy" onerror="this.remove()">`:''}${i===0?'<span class="latest-badge">Najnovšie</span>':''}${has?`<a class="play-hit" href="${esc(v.youtubeUrl)}" target="_blank" rel="noopener" aria-label="Otvoriť video"></a>`:''}</div><div class="card-info"><div class="title-row"><a class="video-title" ${has?`href="${esc(v.youtubeUrl)}" target="_blank" rel="noopener"`:''}>${esc(v.title)}</a>${sourceButton(v.id)}</div></div></article>`}).join('');$$('[data-sources]',g).forEach(b=>b.onclick=()=>openSources(b.dataset.sources))}
function openSources(id){const v=data.videos.find(x=>x.id===id);if(!v)return;$('#sourcesTitle').textContent=v.title;const s=(v.sources||[]).filter(x=>x.url?.trim());$('#sourcesList').innerHTML=s.length?s.map((x,i)=>`<a class="source-link" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer"><span class="source-num">${String(i+1).padStart(2,'0')}</span><span><div class="source-name">${esc(x.name?.trim()||domain(x.url)||`Zdroj ${i+1}`)}</div><div class="source-domain">${esc(domain(x.url))}</div></span><span>↗</span></a>`).join(''):'<div class="empty-sources">Zdroje k tomuto videu ešte neboli pridané.</div>';open($('#sourcesBackdrop'))}
function open(el){el.classList.add('open');el.setAttribute('aria-hidden','false')}function close(el){el.classList.remove('open');el.setAttribute('aria-hidden','true')}
function current(){return working.videos.find(v=>v.id===selected)}function index(){return working.videos.findIndex(v=>v.id===selected)}
function sync(){const v=current();if(!v)return;const u=$('#youtubeUrl'),t=$('#titleInput');if(u)v.youtubeUrl=u.value.trim();if(t)v.title=t.value.trim();$$('.source-edit').forEach(r=>{const i=+r.dataset.i;if(v.sources[i]){v.sources[i].name=$('.name',r).value;v.sources[i].url=$('.url',r).value}})}
function editorList(){const l=$('#videoList');l.innerHTML=working.videos.map((v,i)=>`<button class="video-pick ${v.id===selected?'active':''}" data-id="${esc(v.id)}" type="button">${i===0?'<small>Najnovšie</small>':''}<strong>${esc(v.title||'Nové video')}</strong></button>`).join('');$$('[data-id]',l).forEach(b=>b.onclick=()=>{sync();selected=b.dataset.id;editorList();editorContent()})}
function sourceEditor(){const v=current(),l=$('#sourceEditList');if(!v||!l)return;v.sources=Array.isArray(v.sources)?v.sources:[];l.innerHTML=v.sources.map((s,i)=>`<div class="source-edit" data-i="${i}"><input class="input name" value="${esc(s.name||'')}" placeholder="Názov zdroja"><input class="input url" value="${esc(s.url||'')}" placeholder="https://..."><button class="remove-source" type="button">✕</button></div>`).join('');$$('.source-edit',l).forEach(r=>{const i=+r.dataset.i;$('.name',r).oninput=e=>v.sources[i].name=e.target.value;$('.url',r).oninput=e=>v.sources[i].url=e.target.value;$('.remove-source',r).onclick=()=>{v.sources.splice(i,1);sourceEditor()}})}
function preview(url,title){const h=$('#preview');if(!h)return;const t=thumb(url);h.innerHTML=t?`<div class="preview"><img src="${esc(t)}" alt="Náhľad"><div><strong>Náhľad videa</strong><span>${esc(title||'')}</span></div></div>`:''}
function editorContent(){const box=$('#editorContent'),v=current();if(!v){box.innerHTML='<div class="editor-empty">Pridaj prvé video.</div>';return}const i=index();box.innerHTML=`<div class="toolbar"><button class="btn" id="up" ${i===0?'disabled':''}>↑ Vyššie</button><button class="btn" id="down" ${i===working.videos.length-1?'disabled':''}>↓ Nižšie</button><button class="btn-danger" id="deleteVideo">Vymazať video</button></div><div class="field"><label>YouTube link</label><div class="youtube-row"><input class="input" id="youtubeUrl" value="${esc(v.youtubeUrl)}" placeholder="https://www.youtube.com/watch?v=..."><button class="btn" id="fetchVideo">Načítať video</button></div><div class="status" id="status"></div><div id="preview"></div></div><div class="field"><label>Názov videa</label><textarea class="textarea" id="titleInput">${esc(v.title)}</textarea></div><div class="field"><label>Zdroje</label><div class="source-edit-list" id="sourceEditList"></div><button class="btn add-source" id="addSource">+ Pridať zdroj</button></div>`;preview(v.youtubeUrl,v.title);sourceEditor();$('#youtubeUrl').oninput=e=>{v.youtubeUrl=e.target.value;preview(v.youtubeUrl,$('#titleInput').value)};$('#titleInput').oninput=e=>{v.title=e.target.value;editorList()};$('#addSource').onclick=()=>{sync();v.sources.push({name:'',url:''});sourceEditor()};$('#up').onclick=()=>move(-1);$('#down').onclick=()=>move(1);$('#deleteVideo').onclick=()=>{if(!confirm('Vymazať toto video?'))return;const n=index();working.videos.splice(n,1);selected=working.videos[Math.min(n,working.videos.length-1)]?.id||null;editorList();editorContent()};$('#fetchVideo').onclick=fetchInfo}
async function fetchInfo(){const v=current(),url=$('#youtubeUrl').value.trim(),st=$('#status');if(!ytId(url)){st.textContent='Vlož platný YouTube link.';st.className='status bad';return}v.youtubeUrl=url;preview(url,$('#titleInput').value);st.textContent='Načítavam názov...';try{const r=await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`);if(!r.ok)throw 0;const j=await r.json();v.title=j.title||v.title;$('#titleInput').value=v.title;editorList();preview(url,v.title);st.textContent='Video načítané.';st.className='status good'}catch{st.textContent='Thumbnail funguje. Názov môžeš napísať ručne.';st.className='status bad'}}
function move(d){sync();const i=index(),j=i+d;if(i<0||j<0||j>=working.videos.length)return;[working.videos[i],working.videos[j]]=[working.videos[j],working.videos[i]];editorList();editorContent()}
function cleanWorking(){sync();return{videos:working.videos.map(v=>({...v,title:(v.title||'Bez názvu').trim(),youtubeUrl:(v.youtubeUrl||'').trim(),sources:(v.sources||[]).map(s=>({name:(s.name||'').trim(),url:(s.url||'').trim()})).filter(s=>s.url)}))}}
function openEditor(){working=copy(data);selected=working.videos[0]?.id||null;editorList();editorContent();$('#publishStatus').textContent='';open($('#editorBackdrop'))}
function utf8Base64(str){const bytes=new TextEncoder().encode(str);let bin='';for(const b of bytes)bin+=String.fromCharCode(b);return btoa(bin)}
async function publish(){const token=$('#githubToken').value.trim(),status=$('#publishStatus');if(!token){status.textContent='Vlož GitHub token.';status.className='publish-status bad';return}const payload=cleanWorking();status.textContent='Publikujem na GitHub...';status.className='publish-status';try{const api=`https://api.github.com/repos/${REPO}/contents/${DATA_FILE}`;const h={Accept:'application/vnd.github+json',Authorization:`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};const cur=await fetch(api,{headers:h});if(!cur.ok)throw new Error('Token nemá prístup k repo alebo Contents write.');const meta=await cur.json();const body={message:'Update video library',content:utf8Base64(JSON.stringify(payload,null,2)),sha:meta.sha,branch:'main'};const put=await fetch(api,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!put.ok){const e=await put.json().catch(()=>({}));throw new Error(e.message||'GitHub odmietol zápis.')}data=copy(payload);render();status.textContent='Publikované. Zmenu uvidia všetci návštevníci.';status.className='publish-status good';setTimeout(()=>close($('#editorBackdrop')),900)}catch(e){status.textContent=e.message||'Publikovanie zlyhalo.';status.className='publish-status bad'}}
$('#editTrigger').onclick=openEditor;$('#closeEditor').onclick=()=>close($('#editorBackdrop'));$('#cancelEditor').onclick=()=>close($('#editorBackdrop'));$('#closeSources').onclick=()=>close($('#sourcesBackdrop'));$('#addVideo').onclick=()=>{sync();const v={id:uid(),title:'Nové video',youtubeUrl:'',sources:[]};working.videos.unshift(v);selected=v.id;editorList();editorContent()};$('#previewSave').onclick=()=>{data=copy(cleanWorking());render();close($('#editorBackdrop'))};$('#publishBtn').onclick=publish;$('#downloadJson').onclick=()=>{const blob=new Blob([JSON.stringify(cleanWorking(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='videos.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#editorBackdrop').onclick=e=>{if(e.target===$('#editorBackdrop'))close(e.currentTarget)};$('#sourcesBackdrop').onclick=e=>{if(e.target===$('#sourcesBackdrop'))close(e.currentTarget)};document.addEventListener('keydown',e=>{if(e.key==='Escape'){close($('#editorBackdrop'));close($('#sourcesBackdrop'))}});
loadShared();
</script>
