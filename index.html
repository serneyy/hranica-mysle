<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Hranica Mysle - videá a zdroje.">
<title>Hranica Mysle | Zdroje</title>
<style>
:root{--brand:#220eec;--brand-dark:#1708b8;--text:#111116;--muted:#777781;--line:#e9e9ee;--soft:#f5f3ff;--shadow:0 20px 60px rgba(34,14,236,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;background:#fff;color:var(--text);font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit}.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topbar-inner{width:min(1180px,calc(100% - 40px));height:76px;margin:auto;display:flex;align-items:center}.brand{color:var(--brand);font-size:28px;font-weight:800;letter-spacing:-.065em}.page{width:min(1180px,calc(100% - 40px));margin:auto;padding:34px 0 90px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:38px 22px}.card{min-width:0}.thumb{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#efedff,#fafafe);border:1px solid #eeeeF4;transition:.2s ease}.card:hover .thumb{transform:translateY(-2px);box-shadow:0 15px 36px rgba(34,14,236,.10)}.card.latest .thumb{outline:2px solid var(--brand);outline-offset:2px}.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.thumb-fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--brand);font-size:clamp(20px,3vw,34px);font-weight:800;letter-spacing:-.06em}.play-hit{position:absolute;inset:0;z-index:2}.latest-badge{position:absolute;z-index:3;top:11px;left:11px;padding:7px 9px 6px;border-radius:999px;background:var(--brand);color:#fff;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.card-info{padding:14px 2px 0}.title-row{position:relative;min-height:44px;padding-right:106px}.video-title{display:-webkit-box;max-width:100%;padding-top:2px;font-size:16px;line-height:1.3;font-weight:700;letter-spacing:-.02em;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.video-title[href]:hover{color:var(--brand)}.sources-btn{position:absolute;right:0;top:0;min-width:96px;height:36px;padding:0 14px;border:1px solid var(--brand);border-radius:999px;background:var(--brand);color:#fff;font-size:10px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px rgba(34,14,236,.15);transition:.16s ease}.sources-btn svg{width:13px;height:13px;transition:transform .16s ease}.sources-btn:hover{background:var(--brand-dark);border-color:var(--brand-dark);transform:translateY(-1px);box-shadow:0 9px 22px rgba(34,14,236,.22)}.sources-btn:hover svg{transform:translateX(2px)}.empty{grid-column:1/-1;padding:60px 0;text-align:center;color:var(--muted);font-size:13px}.backdrop{position:fixed;inset:0;z-index:100;background:rgba(18,18,26,.32);backdrop-filter:blur(8px);display:grid;place-items:center;padding:18px;opacity:0;pointer-events:none;transition:.2s}.backdrop.open{opacity:1;pointer-events:auto}.modal{width:min(620px,100%);max-height:calc(100vh - 36px);overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);transform:translateY(10px) scale(.985);transition:.2s}.backdrop.open .modal{transform:none}.modal-head{padding:20px 22px 17px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.kicker{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}.modal-title{font-size:21px;line-height:1.15;font-weight:700;letter-spacing:-.03em}.close{flex:0 0 38px;width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer}.close:hover{background:#f7f7fa}.source-list{max-height:520px;overflow:auto;padding:10px 18px 18px}.source-link{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;padding:13px 5px;border-bottom:1px solid #f0f0f3}.source-link:hover{color:var(--brand)}.source-num{font-size:10px;color:#aaaab2}.source-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.source-domain{font-size:10px;color:#9999a3;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.source-arrow{color:#aaaab2}.empty-sources{padding:28px 4px;color:#8f8f99;font-size:12px;text-align:center}
@media(max-width:900px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.topbar-inner,.page{width:min(100% - 28px,1180px)}.topbar-inner{height:68px}.brand{font-size:24px}.page{padding-top:26px}.gallery{grid-template-columns:1fr;gap:30px}.video-title{font-size:17px}.title-row{padding-right:104px}.sources-btn{min-width:94px}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><div class="brand">hranica mysle.</div></div></header>
<main class="page"><section class="gallery" id="gallery"><div class="empty">Načítavam videá...</div></section></main>
<div class="backdrop" id="backdrop" aria-hidden="true"><div class="modal"><div class="modal-head"><div><div class="kicker">Zdroje k videu</div><div class="modal-title" id="modalTitle"></div></div><button class="close" id="closeModal" type="button">✕</button></div><div class="source-list" id="sourceList"></div></div></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isHttp=u=>{try{const x=new URL(u);return x.protocol==='http:'||x.protocol==='https:'}catch{return false}};
const domain=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return u||''}};
function ytId(url=''){try{const u=new URL(url.trim());if(u.hostname.includes('youtu.be'))return u.pathname.split('/').filter(Boolean)[0]||'';if(u.hostname.includes('youtube.com')){if(u.searchParams.get('v'))return u.searchParams.get('v');const p=u.pathname.split('/').filter(Boolean),i=p.findIndex(x=>['shorts','embed','live'].includes(x));if(i>=0)return p[i+1]||''}}catch{}return''}
const thumb=u=>ytId(u)?`https://i.ytimg.com/vi/${ytId(u)}/maxresdefault.jpg`:'';
let data={videos:[]};
function sourceButton(id){return`<button class="sources-btn" type="button" data-sources="${esc(id)}"><span>Zdroje</span><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h11M11 6l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`}
function render(){const g=$('#gallery');const videos=Array.isArray(data.videos)?data.videos:[];if(!videos.length){g.innerHTML='<div class="empty">Zatiaľ tu nie sú žiadne videá.</div>';return}g.innerHTML=videos.map((v,i)=>{const y=ytId(v.youtubeUrl||''),t=thumb(v.youtubeUrl||'');return`<article class="card ${i===0?'latest':''}"><div class="thumb"><div class="thumb-fallback">hranica mysle.</div>${t?`<img src="${esc(t)}" alt="${esc(v.title||'Video')}" loading="lazy" onerror="this.remove()">`:''}${i===0?'<span class="latest-badge">Najnovšie</span>':''}${y?`<a class="play-hit" href="${esc(v.youtubeUrl)}" target="_blank" rel="noopener" aria-label="Otvoriť video"></a>`:''}</div><div class="card-info"><div class="title-row"><a class="video-title" ${y?`href="${esc(v.youtubeUrl)}" target="_blank" rel="noopener"`:''}>${esc(v.title||'Bez názvu')}</a>${sourceButton(v.id)}</div></div></article>`}).join('');$$('[data-sources]',g).forEach(b=>b.onclick=()=>openSources(b.dataset.sources))}
function openSources(id){const v=(data.videos||[]).find(x=>String(x.id)===String(id));if(!v)return;$('#modalTitle').textContent=v.title||'Bez názvu';const src=(v.sources||[]).filter(s=>s.url&&isHttp(s.url));$('#sourceList').innerHTML=src.length?src.map((s,i)=>`<a class="source-link" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer"><span class="source-num">${String(i+1).padStart(2,'0')}</span><span><div class="source-name">${esc((s.name||'').trim()||domain(s.url)||`Zdroj ${i+1}`)}</div><div class="source-domain">${esc(domain(s.url))}</div></span><span class="source-arrow">↗</span></a>`).join(''):'<div class="empty-sources">Zdroje k tomuto videu ešte neboli pridané.</div>';$('#backdrop').classList.add('open');$('#backdrop').setAttribute('aria-hidden','false')}
function close(){$('#backdrop').classList.remove('open');$('#backdrop').setAttribute('aria-hidden','true')}
$('#closeModal').onclick=close;$('#backdrop').onclick=e=>{if(e.target===$('#backdrop'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
(async()=>{try{const r=await fetch(`videos.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw 0;data=await r.json();render()}catch{$('#gallery').innerHTML='<div class="empty">Nepodarilo sa načítať videá.</div>'}})();
</script>
</body>
</html>
