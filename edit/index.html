<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<title>Hranica Mysle | Edit</title>
<style>
:root{--brand:#220eec;--brand-dark:#1708b8;--text:#111116;--muted:#777781;--line:#e7e7ed;--soft:#f6f5ff;--danger:#c52f4c;--green:#16835c;--shadow:0 28px 90px rgba(24,20,60,.14)}
*{box-sizing:border-box}body{margin:0;min-width:320px;background:#fff;color:var(--text);font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}button{color:inherit}.hidden{display:none!important}.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 25%,rgba(34,14,236,.08),transparent 32%),#fff}.gate-card{width:min(430px,100%);padding:34px;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);background:#fff}.brand{color:var(--brand);font-size:30px;font-weight:800;letter-spacing:-.065em}.gate-title{margin:34px 0 7px;font-size:23px;font-weight:700;letter-spacing:-.035em}.gate-copy{margin:0 0 20px;color:var(--muted);font-size:12px;line-height:1.5}.pin-row{display:grid;grid-template-columns:1fr auto;gap:9px}.input,.textarea{width:100%;border:1px solid #d9d9e1;border-radius:12px;background:#fff;padding:12px 13px;outline:none;font-size:13px;transition:.15s}.input:focus,.textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(34,14,236,.07)}.pin{font-size:20px;font-weight:700;letter-spacing:.25em;text-align:center}.btn,.primary,.danger{min-height:42px;padding:0 14px;border-radius:12px;font-size:11px;font-weight:800;cursor:pointer;transition:.15s}.btn{border:1px solid #d9d9e1;background:#fff}.btn:hover{background:#f7f7fa}.primary{border:1px solid var(--brand);background:var(--brand);color:#fff}.primary:hover{background:var(--brand-dark);border-color:var(--brand-dark);transform:translateY(-1px)}.danger{border:1px solid #efd1d8;background:#fff7f8;color:var(--danger)}.error{min-height:17px;margin-top:9px;color:var(--danger);font-size:11px}.app{min-height:100vh;background:#fff}.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topbar-inner{width:min(1180px,calc(100% - 40px));height:74px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}.top-actions{display:flex;gap:8px}.editor{width:min(1180px,calc(100% - 40px));height:calc(100vh - 74px);margin:auto;display:grid;grid-template-columns:320px minmax(0,1fr);border-left:1px solid var(--line);border-right:1px solid var(--line)}.sidebar{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);border-right:1px solid var(--line);background:#fafafd}.sidebar-head{padding:14px;border-bottom:1px solid var(--line)}.add-video{width:100%;border-style:dashed;color:var(--brand)}.video-list{overflow:auto;padding:8px}.video-item{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:11px;cursor:pointer}.video-item:hover{background:#f0f0f4}.video-item.active{background:#ece9ff;color:#1d0aa9}.video-item small{display:block;margin-bottom:4px;color:var(--brand);font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.video-item strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.3}.content{min-width:0;overflow:auto;padding:28px}.empty{height:100%;display:grid;place-items:center;color:#9999a2;font-size:12px;text-align:center}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:23px;padding-bottom:18px;border-bottom:1px solid var(--line)}.field{margin-bottom:20px}.field label{display:block;margin-bottom:7px;color:#616169;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.youtube-row{display:grid;grid-template-columns:1fr auto;gap:8px}.status{min-height:16px;margin-top:7px;color:#888891;font-size:10px}.status.good{color:var(--green)}.status.bad{color:var(--danger)}.preview{margin-top:10px;display:grid;grid-template-columns:180px 1fr;gap:13px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:13px;background:#fafafd}.preview img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#f0f0f4}.preview strong{display:block;margin-bottom:4px;font-size:11px}.preview span{color:#92929b;font-size:10px}.textarea{min-height:76px;resize:vertical}.source-list{display:grid;gap:8px}.source-row{display:grid;grid-template-columns:.8fr 1.2fr 40px;gap:7px}.remove{border:1px solid #efd1d8;border-radius:10px;background:#fff7f8;color:var(--danger);cursor:pointer}.remove:hover{background:#ffedf1}.add-source{width:100%;margin-top:9px;border-style:dashed}.publish{margin-top:30px;padding:20px;border:1px solid #dedafc;border-radius:18px;background:#faf9ff}.publish-title{font-size:15px;font-weight:700;letter-spacing:-.02em}.publish-copy{margin:5px 0 14px;color:#7f7f89;font-size:10px;line-height:1.45}.publish-row{display:grid;grid-template-columns:1fr auto;gap:8px}.publish-status{min-height:16px;margin-top:8px;font-size:10px;color:#878790}.publish-status.good{color:var(--green)}.publish-status.bad{color:var(--danger)}
@media(max-width:760px){.topbar-inner,.editor{width:min(100% - 24px,1180px)}.editor{height:auto;min-height:calc(100vh - 74px);grid-template-columns:1fr;grid-template-rows:220px auto}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.content{padding:20px}.source-row{grid-template-columns:1fr 40px}.source-row .source-name,.source-row .source-url{grid-column:1}.source-row .remove{grid-column:2;grid-row:1/3}.youtube-row,.publish-row,.pin-row{grid-template-columns:1fr}.preview{grid-template-columns:110px 1fr}.gate-card{padding:26px}.brand{font-size:26px}}
</style>
</head>
<body>
<section class="gate" id="gate">
  <div class="gate-card">
    <div class="brand">hranica mysle.</div>
    <div class="gate-title">Edit mode</div>
    <p class="gate-copy">Zadaj PIN pre otvorenie editora.</p>
    <form id="pinForm">
      <div class="pin-row"><input class="input pin" id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="••••••"><button class="primary" type="submit">Odomknúť</button></div>
      <div class="error" id="pinError"></div>
    </form>
  </div>
</section>
<section class="app hidden" id="app">
  <header class="topbar"><div class="topbar-inner"><div class="brand">hranica mysle.</div><div class="top-actions"><a class="btn" href="../">Verejná stránka</a><button class="btn" id="lockBtn" type="button">Zamknúť</button></div></div></header>
  <main class="editor">
    <aside class="sidebar"><div class="sidebar-head"><button class="btn add-video" id="addVideo" type="button">+ Pridať nové video</button></div><div class="video-list" id="videoList"></div></aside>
    <section class="content" id="content"><div class="empty">Načítavam dáta...</div></section>
  </main>
</section>
<script>
const REPO='serneyy/hranica-mysle',DATA_FILE='videos.json',PIN_HASH='c7a2664bf442394c4200f7b942470e0f50f2aac577b5d30479186ea00fb2f743';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],copy=o=>JSON.parse(JSON.stringify(o)),uid=()=>`v_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`;
const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ytId(url=''){try{const u=new URL(url.trim());if(u.hostname.includes('youtu.be'))return u.pathname.split('/').filter(Boolean)[0]||'';if(u.hostname.includes('youtube.com')){if(u.searchParams.get('v'))return u.searchParams.get('v');const p=u.pathname.split('/').filter(Boolean),i=p.findIndex(x=>['shorts','embed','live'].includes(x));if(i>=0)return p[i+1]||''}}catch{}return''}
const thumb=u=>ytId(u)?`https://i.ytimg.com/vi/${ytId(u)}/maxresdefault.jpg`:'';
async function sha256(s){const b=new TextEncoder().encode(s),h=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function unlock(){sessionStorage.setItem('hm_edit_unlocked','1');$('#gate').classList.add('hidden');$('#app').classList.remove('hidden');loadShared()}
function lock(){sessionStorage.removeItem('hm_edit_unlocked');$('#app').classList.add('hidden');$('#gate').classList.remove('hidden');$('#pinInput').value='';$('#pinInput').focus()}
$('#pinForm').addEventListener('submit',async e=>{e.preventDefault();const pin=$('#pinInput').value.trim();$('#pinError').textContent='';if(await sha256(pin)===PIN_HASH){unlock()}else{$('#pinError').textContent='Nesprávny PIN.';$('#pinInput').select()}});$('#lockBtn').onclick=lock;
let data={videos:[]},working={videos:[]},selected=null;
function normalize(x){return{videos:(Array.isArray(x?.videos)?x.videos:[]).map(v=>({id:v.id||uid(),title:v.title||'Bez názvu',youtubeUrl:v.youtubeUrl||'',sources:Array.isArray(v.sources)?v.sources:[]}))}}
async function loadShared(){try{const r=await fetch(`../${DATA_FILE}?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw 0;data=normalize(await r.json());working=copy(data);selected=working.videos[0]?.id||null;renderEditor()}catch{$('#content').innerHTML='<div class="empty">Nepodarilo sa načítať videos.json.</div>'}}
function current(){return working.videos.find(v=>v.id===selected)}function currentIndex(){return working.videos.findIndex(v=>v.id===selected)}
function sync(){const v=current();if(!v)return;const u=$('#youtubeUrl'),t=$('#titleInput');if(u)v.youtubeUrl=u.value.trim();if(t)v.title=t.value.trim();$$('.source-row').forEach(r=>{const i=+r.dataset.i;if(v.sources[i]){v.sources[i].name=$('.source-name',r).value;v.sources[i].url=$('.source-url',r).value}})}
function renderEditor(){renderList();renderContent()}
function renderList(){const l=$('#videoList');l.innerHTML=working.videos.map((v,i)=>`<button class="video-item ${v.id===selected?'active':''}" data-id="${esc(v.id)}" type="button">${i===0?'<small>Najnovšie</small>':''}<strong>${esc(v.title||'Nové video')}</strong></button>`).join('');$$('[data-id]',l).forEach(b=>b.onclick=()=>{sync();selected=b.dataset.id;renderEditor()})}
function renderSources(){const v=current(),l=$('#sourceRows');if(!v||!l)return;v.sources=Array.isArray(v.sources)?v.sources:[];l.innerHTML=v.sources.map((s,i)=>`<div class="source-row" data-i="${i}"><input class="input source-name" value="${esc(s.name||'')}" placeholder="Názov zdroja"><input class="input source-url" value="${esc(s.url||'')}" placeholder="https://..."><button class="remove" type="button">✕</button></div>`).join('');$$('.source-row',l).forEach(r=>{const i=+r.dataset.i;$('.source-name',r).oninput=e=>v.sources[i].name=e.target.value;$('.source-url',r).oninput=e=>v.sources[i].url=e.target.value;$('.remove',r).onclick=()=>{v.sources.splice(i,1);renderSources()}})}
function renderPreview(){const v=current(),p=$('#preview');if(!v||!p)return;const t=thumb(v.youtubeUrl);p.innerHTML=t?`<div class="preview"><img src="${esc(t)}" alt="Náhľad"><div><strong>Náhľad videa</strong><span>${esc(v.title||'')}</span></div></div>`:''}
function renderContent(){const box=$('#content'),v=current();if(!v){box.innerHTML='<div class="empty">Pridaj prvé video.</div>';return}const i=currentIndex();box.innerHTML=`
<div class="toolbar"><button class="btn" id="moveUp" ${i===0?'disabled':''}>↑ Vyššie</button><button class="btn" id="moveDown" ${i===working.videos.length-1?'disabled':''}>↓ Nižšie</button><button class="danger" id="deleteVideo" type="button">Vymazať video</button></div>
<div class="field"><label>YouTube link</label><div class="youtube-row"><input class="input" id="youtubeUrl" value="${esc(v.youtubeUrl)}" placeholder="https://www.youtube.com/watch?v=..."><button class="btn" id="fetchVideo" type="button">Načítať video</button></div><div class="status" id="videoStatus"></div><div id="preview"></div></div>
<div class="field"><label>Názov videa</label><textarea class="textarea" id="titleInput">${esc(v.title)}</textarea></div>
<div class="field"><label>Zdroje</label><div class="source-list" id="sourceRows"></div><button class="btn add-source" id="addSource" type="button">+ Pridať zdroj</button></div>
<div class="publish"><div class="publish-title">Publikovať pre všetkých</div><div class="publish-copy">Zmeny sa zapíšu do spoločného videos.json v GitHube. Token musí mať Contents: Read and write iba pre repo serneyy/hranica-mysle.</div><div class="publish-row"><input class="input" id="githubToken" type="password" autocomplete="off" placeholder="github_pat_..."><button class="primary" id="publishBtn" type="button">Publikovať</button></div><div class="publish-status" id="publishStatus"></div></div>`;
renderSources();renderPreview();$('#youtubeUrl').oninput=e=>{v.youtubeUrl=e.target.value;renderPreview()};$('#titleInput').oninput=e=>{v.title=e.target.value;renderList();renderPreview()};$('#addSource').onclick=()=>{sync();v.sources.push({name:'',url:''});renderSources()};$('#moveUp').onclick=()=>move(-1);$('#moveDown').onclick=()=>move(1);$('#deleteVideo').onclick=deleteVideo;$('#fetchVideo').onclick=fetchVideoInfo;$('#publishBtn').onclick=publish}
function move(d){sync();const i=currentIndex(),j=i+d;if(i<0||j<0||j>=working.videos.length)return;[working.videos[i],working.videos[j]]=[working.videos[j],working.videos[i]];renderEditor()}
function deleteVideo(){if(!confirm('Vymazať toto video?'))return;const i=currentIndex();working.videos.splice(i,1);selected=working.videos[Math.min(i,working.videos.length-1)]?.id||null;renderEditor()}
async function fetchVideoInfo(){const v=current(),url=$('#youtubeUrl').value.trim(),st=$('#videoStatus');if(!ytId(url)){st.textContent='Vlož platný YouTube link.';st.className='status bad';return}v.youtubeUrl=url;renderPreview();st.textContent='Načítavam názov...';st.className='status';try{const r=await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`);if(!r.ok)throw 0;const j=await r.json();v.title=j.title||v.title;$('#titleInput').value=v.title;renderList();renderPreview();st.textContent='Video načítané.';st.className='status good'}catch{st.textContent='Thumbnail sa načíta z linku. Názov môžeš napísať ručne.';st.className='status bad'}}
function clean(){sync();return{videos:working.videos.map(v=>({...v,title:(v.title||'Bez názvu').trim(),youtubeUrl:(v.youtubeUrl||'').trim(),sources:(v.sources||[]).map(s=>({name:(s.name||'').trim(),url:(s.url||'').trim()})).filter(s=>s.url)}))}}
function b64utf8(str){const bytes=new TextEncoder().encode(str);let bin='';for(const b of bytes)bin+=String.fromCharCode(b);return btoa(bin)}
async function publish(){const token=$('#githubToken').value.trim(),st=$('#publishStatus');if(!token){st.textContent='Vlož GitHub token.';st.className='publish-status bad';return}const payload=clean();st.textContent='Publikujem...';st.className='publish-status';try{const api=`https://api.github.com/repos/${REPO}/contents/${DATA_FILE}`,headers={Accept:'application/vnd.github+json',Authorization:`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};const cur=await fetch(api,{headers});if(!cur.ok)throw new Error('Token nemá prístup alebo Contents write.');const meta=await cur.json();const body={message:'Update video library',content:b64utf8(JSON.stringify(payload,null,2)),sha:meta.sha,branch:'main'};const put=await fetch(api,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!put.ok){const e=await put.json().catch(()=>({}));throw new Error(e.message||'GitHub odmietol zápis.')}data=copy(payload);working=copy(payload);st.textContent='Publikované. Zmenu uvidia všetci návštevníci.';st.className='publish-status good'}catch(e){st.textContent=e.message||'Publikovanie zlyhalo.';st.className='publish-status bad'}}
$('#addVideo').onclick=()=>{sync();const v={id:uid(),title:'Nové video',youtubeUrl:'',sources:[]};working.videos.unshift(v);selected=v.id;renderEditor()};
if(sessionStorage.getItem('hm_edit_unlocked')==='1')unlock();else setTimeout(()=>$('#pinInput').focus(),50);
</script>
</body>
</html>
